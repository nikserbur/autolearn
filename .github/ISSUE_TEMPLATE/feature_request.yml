name: Feature or research idea
description: A new environment check, review step, retrieval improvement or skill
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What keeps going wrong (or what you keep doing by hand)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: A research journal row, a review, a trace, a retrieval miss. Redact private details.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would have caught it or made it cheaper, and how you would measure that.
